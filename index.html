<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Ramka.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Ramki są zawsze na tym samym miejscu, jedna nad drugą */
        iframe { 
            position: absolute; 
            border: none; 
            background: transparent; 
            overflow: hidden; 
            transition: opacity 1s ease-in-out; 
        }

        /* --- USTAWIENIA POZYCJI (nie zmieniaj ich) --- */
        #alerts { top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
        .pos-timer { bottom: 5.5%; left: 50.0%; transform: translateX(-50%); width: 180px; height: 50px; }
        .pos-moving-top { bottom: 8.0%; left: 7.5%; width: 19%; height: 45px; }
        .pos-goal-bar { bottom: 9.5%; right: -1.5%; width: 35%; height: 75px; }
        .pos-static-top { top: 7%; left: 2%; width: 15%; height: 31%; }
    </style>
</head>
<body>
    <div id="main-container" class="overlay-container">
        <iframe id="alerts" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" scrolling="no"></iframe>
        
        <iframe id="timer" class="pos-timer" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving-top" class="pos-moving-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal-bar" class="pos-goal-bar" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static-top" class="pos-static-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>
    </div>

    <script>
    function refreshWithDelay(id, baseUrl, className) {
        const container = document.getElementById('main-container');
        const oldIframe = document.getElementById(id);
        if (!oldIframe) return;

        // 1. Tworzymy nową ramkę pod spodem (niższy z-index)
        const newIframe = document.createElement('iframe');
        newIframe.src = baseUrl + "?t=" + new Date().getTime();
        newIframe.className = className;
        newIframe.style.zIndex = parseInt(window.getComputedStyle(oldIframe).zIndex) - 1;
        newIframe.style.opacity = "0";
        newIframe.scrolling = "no";
        newIframe.id = id + "_temp";

        container.appendChild(newIframe);

        // 2. Sztywne opóźnienie (3 sekundy) na wczytanie zawartości
        setTimeout(() => {
            newIframe.style.opacity = "1";
            oldIframe.style.opacity = "0";

            // 3. Po animacji usuwamy starą i porządkujemy ID
            setTimeout(() => {
                oldIframe.remove();
                newIframe.id = id;
                newIframe.style.zIndex = parseInt(newIframe.style.zIndex) + 1;
            }, 1100);
        }, 3000); 
    }

    function runUpdate() {
        refreshWithDelay('timer', "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268", "pos-timer");
        refreshWithDelay('moving-top', "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277", "pos-moving-top");
        refreshWithDelay('goal-bar', "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117", "pos-goal-bar");
        refreshWithDelay('static-top', "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166", "pos-static-top");
    }

    // Odświeżanie co 30 sekund
    setInterval(runUpdate, 30000);
    </script>
</body>
</html>
