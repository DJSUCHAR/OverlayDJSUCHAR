<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Ramka.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        iframe { 
            position: absolute; 
            border: none; 
            background: transparent; 
            overflow: hidden; 
            /* Bardzo długi czas przejścia dla miękkości */
            transition: opacity 5s ease-in-out; 
        }

        /* --- POZYCJE --- */
        #alerts { top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
        .pos-timer { bottom: 5.5%; left: 50.0%; transform: translateX(-50%); width: 180px; height: 50px; }
        .pos-moving-top { bottom: 8.0%; left: 7.5%; width: 19%; height: 45px; }
        .pos-goal-bar { bottom: 9.5%; right: -1.5%; width: 35%; height: 75px; }
        .pos-static-top { top: 7%; left: 2%; width: 15%; height: 31%; }

        /* Grupa A jest na górze, Grupa B pod nią */
        .group-a { z-index: 100; opacity: 1; }
        .group-b { z-index: 90; opacity: 0; }
    </style>
</head>
<body>
    <div id="main-container" class="overlay-container">
        <iframe id="alerts" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" scrolling="no"></iframe>
        
        <!-- GRUPA A -->
        <iframe id="timer_a" class="pos-timer group-a" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving_a" class="pos-moving-top group-a" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal_a" class="pos-goal-bar group-a" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static_a" class="pos-static-top group-a" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>

        <!-- GRUPA B -->
        <iframe id="timer_b" class="pos-timer group-b" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving_b" class="pos-moving-top group-b" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal_b" class="pos-goal-bar group-b" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static_b" class="pos-static-top group-b" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>
    </div>

    <script>
    let activeGroup = 'a';
    const urls = {
        timer: "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268",
        moving: "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277",
        goal: "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117",
        static: "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166"
    };

    function switchGroups() {
        const nextGroup = (activeGroup === 'a') ? 'b' : 'a';
        const timestamp = new Date().getTime();

        // 1. Ładujemy niewidoczną grupę w tle
        document.getElementById('timer_' + nextGroup).src = urls.timer + "?t=" + timestamp;
        document.getElementById('moving_' + nextGroup).src = urls.moving + "?t=" + timestamp;
        document.getElementById('goal_' + nextGroup).src = urls.goal + "?t=" + timestamp;
        document.getElementById('static_' + nextGroup).src = urls.static + "?t=" + timestamp;

        // 2. Dajemy 10 sekund na pełny load w tle
        setTimeout(() => {
            const currentElements = document.getElementsByClassName('group-' + activeGroup);
            const nextElements = document.getElementsByClassName('group-' + nextGroup);

            // 3. LOGIKA OVERLAP: Najpierw pokazujemy nową warstwę (wjeżdża nad starą)
            for (let el of nextElements) {
                el.style.zIndex = "100";
                el.style.opacity = "1";
            }

            // 4. Po krótkiej chwili (np. 1s) zaczynamy chować starą warstwę pod spodem
            setTimeout(() => {
                for (let el of currentElements) {
                    el.style.zIndex = "90";
                    el.style.opacity = "0";
                }
                activeGroup = nextGroup;
            }, 1000);

        }, 10000); 
    }

    setInterval(switchGroups, 60000);
    </script>
</body>
</html>
