<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Ramka.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        iframe { position: absolute; border: none; background: transparent; overflow: hidden; }

        /* --- USTAWIENIA DLA SUCHARTEAM --- */

        #alerts { top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }

        /* Zegar - wycentrowany */
        #timer { 
            bottom: 5.5%; left: 50.0%; transform: translateX(-50%); 
            width: 180px; height: 50px; z-index: 50; 
        }

        /* Ruchomy Top */
        #moving-top { 
            bottom: 8.0%; left: 7.5%; 
            width: 19%; height: 45px; z-index: 40; 
        }

        /* Pasek Energii */
        #goal-bar { 
            bottom: 9.5%; right: -1.5%; 
            width: 35%; height: 75px; z-index: 30; 
        }

        /* Lista Top */
        #static-top { 
            top: 7%; left: 2%; 
            width: 15%; height: 31%; z-index: 20; 
        }
    </style>
</head>
<body>
    <div id="main-container" class="overlay-container">
        <!-- Alerty nie są odświeżane skryptem, aby nie przerywać animacji donacji -->
        <iframe id="alerts" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" scrolling="no"></iframe>
        
        <iframe id="timer" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal-bar" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>
    </div>

    <script>
    function refreshAll() {
        const container = document.getElementById('main-container');
        
        // --- 1. AGRESYWNY RESET LICZNIKA (Usuwanie i tworzenie na nowo) ---
        const oldTimer = document.getElementById('timer');
        if (oldTimer) {
            const timerSrc = "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268";
            oldTimer.remove();
            
            const newTimer = document.createElement('iframe');
            newTimer.id = 'timer';
            newTimer.src = timerSrc + "?update=" + new Date().getTime();
            newTimer.scrolling = 'no';
            container.appendChild(newTimer);
        }

        // --- 2. ODŚWIEŻANIE POZOSTAŁYCH WIDGETÓW ---
        const otherWidgets = ['moving-top', 'static-top', 'goal-bar'];
        otherWidgets.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                const base = el.src.split('?')[0];
                el.src = base + "?u=" + new Date().getTime();
            }
        });
    }

    // Odświeżanie co 20 sekund - optymalne dla Twojego łącza i YoloBoxa
    setInterval(refreshAll, 20000);
    </script>
</body>
</html>
