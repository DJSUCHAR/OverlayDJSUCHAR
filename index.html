<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }

        iframe { 
            position: absolute; 
            border: none; 
            background: transparent; 
            overflow: hidden; 
        }

        /* --- POZYCJE --- */
        #tiktok-count { bottom: 2%; left: 29%; width: 150px; height: 60px; z-index: 1000; }
        #ninja-chat { bottom: 15%; right: 2%; width: 400px; height: 600px; z-index: 500; }
        #alerts { top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }
        
        .pos-timer { bottom: 5.5%; left: 50.0%; transform: translateX(-50%); width: 180px; height: 50px; }
        .pos-moving-top { bottom: 8.5%; left: 5.0%; width: 22%; height: 45px; }
        .pos-goal-bar { bottom: 9.6%; right: -1.5%; width: 35%; height: 79px; }
        .pos-static-top { top: 7%; left: 2.2%; width: 18.0%; height: 31%; overflow: hidden; transform: scale(0.95); transform-origin: top left; }
    </style>
</head>
<body>
    <div id="main-container" class="overlay-container">
        <iframe id="tiktok-count" src="https://tikfinity.zerody.one/widget/viewercount?cid=87665" scrolling="no"></iframe>
        <iframe id="ninja-chat" src="https://socialstream.ninja/featured.html?session=CMjapDkibS&branded&rounded=10&showtime=20000&scale=0.85&showsource" scrolling="no"></iframe>

        <iframe id="alerts" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" scrolling="no"></iframe>

        <iframe id="timer" class="pos-timer" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving" class="pos-moving-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal" class="pos-goal-bar" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static" class="pos-static-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>
    </div>

    <script>
    // Funkcja odświeżająca dane bez mrugania ekranu (dodaje timestamp)
    function refreshWidgets() {
        const timestamp = new Date().getTime();
        const widgets = [
            { id: 'timer', url: 'https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268' },
            { id: 'moving', url: 'https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277' },
            { id: 'goal', url: 'https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117' },
            { id: 'static', url: 'https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166' }
        ];

        widgets.forEach(w => {
            const el = document.getElementById(w.id);
            if (el) {
                el.src = w.url + "?t=" + timestamp;
            }
        });
    }

    // Odświeżaj co 30 sekund
    setInterval(refreshWidgets, 30000);
    </script>
</body>
</html>
