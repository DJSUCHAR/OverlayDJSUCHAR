<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Multi-Overlay Container for YoloBox</title>
    <style>
        /* Reset i tło przezroczyste */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: rgba(0, 0, 0, 0); 
        }

        /* Kontener na nakładki */
        .overlay-container {
            position: relative;
            width: 1920px; /* Dopasuj do rozdzielczości streamu */
            height: 1080px;
        }

        /* Styl dla każdej ramki */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Kolejność warstw (opcjonalnie) */
        #layer1 { z-index: 10; }
        #layer2 { z-index: 20; }
        #layer3 { z-index: 30; }
    </style>
</head>
<body>

    <div class="overlay-container">
        <iframe id="layer1" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" allow="autoplay"></iframe>
        <iframe id="layer2" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" allow="autoplay"></iframe>
        <iframe id="layer3" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" allow="autoplay"></iframe>
    </div>

    <script>
        // Funkcja synchronizująca odświeżanie
        function refreshAll() {
            console.log("Synchronizowane odświeżanie nakładek...");
            const layers = ['layer1', 'layer2', 'layer3'];
            layers.forEach(id => {
                const frame = document.getElementById(id);
                if (frame) {
                    const currentSrc = frame.src;
                    frame.src = ''; // Czyścimy src, aby wymusić przeładowanie
                    frame.src = currentSrc;
                }
            });
        }

        // Ustawienie czasu odświeżania (np. co 5 minut = 300000 ms)
        // Jeśli nie chcesz automatycznego odświeżania, usuń linię poniżej
        setInterval(refreshAll, 300000); 
    </script>
</body>
</html>
