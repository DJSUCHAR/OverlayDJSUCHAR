<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: transparent; 
        }
        
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Ramka.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Styl dla ramek - dodajemy płynne przejście opacity */
        iframe { 
            position: absolute; 
            border: none; 
            background: transparent; 
            overflow: hidden; 
            transition: opacity 0.5s ease-in-out; 
        }

        /* --- USTAWIENIA DLA SUCHARTEAM --- */

        #alerts { top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }

        #timer { 
            bottom: 5.5%; left: 50.0%; transform: translateX(-50%); 
            width: 180px; height: 50px; z-index: 50; 
        }

        #moving-top { 
            bottom: 8.0%; left: 7.5%; 
            width: 19%; height: 45px; z-index: 40; 
        }

        #goal-bar { 
            bottom: 9.5%; right: -1.5%; 
            width: 35%; height: 75px; z-index: 30; 
        }

        #static-top { 
            top: 7%; left: 2%; 
            width: 15%; height: 31%; z-index: 20; 
        }
    </style>
</head>
<body>
    <div id="main-container" class="overlay-container">
        <iframe id="alerts" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27" scrolling="no"></iframe>
        
        <iframe id="timer" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268" scrolling="no"></iframe>
        <iframe id="moving-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277" scrolling="no"></iframe>
        <iframe id="goal-bar" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117" scrolling="no"></iframe>
        <iframe id="static-top" src="https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166" scrolling="no"></iframe>
    </div>

    <script>
    function smoothRefresh(id, baseUrl) {
        const container = document.getElementById('main-container');
        const oldIframe = document.getElementById(id);
        
        if (!oldIframe) return;

        // 1. Tworzymy nową ramkę "w tle"
        const newIframe = document.createElement('iframe');
        newIframe.src = baseUrl + "?u=" + new Date().getTime();
        newIframe.id = id + "_new"; // Tymczasowe ID
        newIframe.style.opacity = "0"; // Ukryta na starcie
        newIframe.style.position = oldIframe.style.position;
        newIframe.style.bottom = oldIframe.style.bottom;
        newIframe.style.top = oldIframe.style.top;
        newIframe.style.left = oldIframe.style.left;
        newIframe.style.right = oldIframe.style.right;
        newIframe.style.transform = oldIframe.style.transform;
        newIframe.style.width = oldIframe.style.width;
        newIframe.style.height = oldIframe.style.height;
        newIframe.style.zIndex = oldIframe.style.zIndex;
        newIframe.scrolling = "no";

        container.appendChild(newIframe);

        // 2. Czekamy, aż nowa ramka się załaduje
        newIframe.onload = function() {
            // 3. Płynna zamiana
            newIframe.style.opacity = "1";
            oldIframe.style.opacity = "0";

            // 4. Usuwamy starą ramkę po zakończeniu animacji (0.5s)
            setTimeout(() => {
                oldIframe.remove();
                newIframe.id = id; // Przywracamy oryginalne ID
            }, 500);
        };
    }

    function refreshAll() {
        // Lista widgetów i ich bazowe linki
        const config = {
            'timer': "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25268",
            'moving-top': "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25277",
            'goal-bar': "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,48117",
            'static-top': "https://www.paymedia.pl/integracja/11507,b329c7a541f4168d382b996801e1ca27,25166"
        };

        for (let id in config) {
            smoothRefresh(id, config[id]);
        }
    }

    // Odświeżanie co 30 sekund - przy płynnym przejściu może być rzadziej, 
    // bo i tak nie widać momentu zmiany.
    setInterval(refreshAll, 30000);
    </script>
</body>
</html>
